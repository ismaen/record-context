<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Record Context</title>
  <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
  <div class="titlebar">
    <span class="app-title">Record Context</span>
    <div class="titlebar-controls">
      <button id="pin-btn" class="icon-btn" title="Always on top">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5"/><path d="M9 11V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v7"/><path d="M5 17h14"/><path d="M7 11l-2 6h14l-2-6"/>
        </svg>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="main-view" class="view">
    <button id="record-btn" class="record-btn idle">
      <span class="record-btn-inner"></span>
      <span class="record-btn-label">Record</span>
    </button>
    <p id="status-text" class="status">Ready</p>
    <div class="stats">
      <span id="duration">00:00</span>
      <span class="separator"></span>
      <span><span id="chunks-count">0</span> chunks</span>
    </div>
    <button id="copy-slack-btn" class="copy-slack-btn hidden">Copy Slack Summary</button>
    <p class="app-watermark">Scribe</p>
  </div>

  <div id="settings-view" class="view hidden">
    <h2>Settings</h2>
    <div class="settings-group">
      <label>
        OpenAI API Key
        <input id="api-key" type="password" placeholder="sk-..." />
      </label>
    </div>
    <div class="settings-group">
      <label>
        Output Directory
        <div class="dir-picker">
          <span id="output-dir" class="dir-path">Not set</span>
          <button id="choose-dir-btn" class="small-btn">Choose</button>
        </div>
      </label>
    </div>
    <div class="settings-group">
      <label>
        Chunk Interval (minutes)
        <input id="chunk-interval" type="number" min="1" max="30" value="5" />
      </label>
    </div>
    <div class="settings-actions">
      <button id="save-settings-btn" class="small-btn primary">Save</button>
      <button id="back-btn" class="small-btn">Back</button>
    </div>
  </div>

  <script src="audio-capture.js"></script>
  <script src="chunk-manager.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
